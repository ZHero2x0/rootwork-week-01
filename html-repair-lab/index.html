<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
  </head>

  <body>
    <header>
      <h1>Tech Club</h1>
      <nav>
        <a href="#about">About</a>
        <a href="#events">Events</a>
        <a href="#join">Join</a>
      </nav>
    </header>
    <hr />
    <main>
      <section id="about">
        <h2>About Us</h2>
        <p>We are a student technology club learning how to build useful things on the web.</p>
        <img
          src="club.png"
          alt="Club members participating in a club activity"
          width="500"
          height="300" />
      </section>
      <hr />
      <section id="events">
        <h2>Upcoming Events</h2>

        <ol>
          <li>
            <article>
              <h3>HTML Workshop</h3>
              <ul>
                <li>
                  <p>Saturday at 10am</p>
                </li>
              </ul>
            </article>
          </li>
          <li>
            <article>
              <h3>Git Practice</h3>
              <ul>
                <li>
                  <p>Sunday at 2pm</p>
                </li>
              </ul>
            </article>
          </li>
        </ol>
      </section>
      <hr />
      <section id="join">
        <h2>Join the Club</h2>
        <form method="POST">
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" placeholder="First & Last Name" required />

          <label for="email">Email:</label>
          <input type="email" id="email" name="email" placeholder="email Address" required />
          <br />
          <label for="reason">Why do you want to join?</label>
          <textarea id="reason" rows="4" cols="30" name="reason"></textarea>
          <br />
          <button type="submit">Send</button>
        </form>
      </section>
    </main>
    <hr />
    <footer>
      <p>&copy; <strong>Tech Club 2026</strong></p>
    </footer>
  </body>
</html>
