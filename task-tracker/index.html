  <body>
    <div id="container">
      <div id="task-card">
        <header>
          <div id="todo">
            <h1>
              <i class="fa-solid fa-list" style="color: #111827"></i>
              My ToDo Tasks
            </h1>
          </div>

          <form id="task-form">
            <label for="task-input" aria-label="task-description"> </label>
            <input type="text" id="task-input" name="text" placeholder="Add a new task" />
            <button type="submit" id="task-btn">Add</button>
          </form>
          <p id="error"></p>
        </header>

        <nav id="nav-filters">
          <div class="filters">
            <button class="filter-btn" id="all">All</button>
            <button class="filter-btn" id="active">Pending</button>
            <button class="filter-btn" id="completed">Completed</button>
          </div>
          <p><span id="task-count"></span> Task(s)</p>
        </nav>
